# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mundial2026
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3-haiku
      - key: AGENT_MAX_TOKENS
        value: "900"
      - key: AGENT_RATE_LIMIT
        value: "20"
      - key: ANALYSIS_RATE_LIMIT
        value: "10"
      - key: ANALYSIS_DAILY_LIMIT
        value: "30"
      - key: ANALYSIS_DAILY_GLOBAL_LIMIT
        value: "500"
      - key: NEXT_PUBLIC_DEFAULT_SEASON
        value: "2026"
      - key: NEXT_PUBLIC_LEAGUE_ID
        value: "1"
      - key: NEXT_PUBLIC_FORCE_LIVE_API
        value: "false"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: worker
    name: mundial2026-telegram
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run telegram:worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3-haiku
      - key: NEXT_PUBLIC_DEFAULT_SEASON
        value: "2026"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
